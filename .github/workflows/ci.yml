name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          # requirements.txt points at the CUDA wheels; CI only needs CPU ones.
          sed '/download.pytorch.org/d' requirements.txt > requirements-ci.txt
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Tests
        # No dataset or model weights here: tests use made-up contracts, a fake tokenizer
        # and a stub LLM client.
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build -t clausescout:ci .
      - name: Check the API answers
        run: |
          docker run -d --name cs -p 127.0.0.1:8000:8000 clausescout:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health
