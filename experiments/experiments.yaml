# Every experiment, one change at a time. All decisions use the validation split; the test
# split needs final: true and is run once at the end.
#
# threshold: the score at which a clause type counts as present, for contract-level metrics.
# n_boot: bootstrap resamples for confidence intervals (0 skips them).

experiments:
  - name: keywords-v1
    method: keywords
    split: val
    threshold: 0.5

  # Fine-tuned extractive QA, as in the CUAD paper. Trained with scripts/train_qa.py on the
  # train split only. Timing run: 1.15 s per step (8x4 windows), 811 steps per epoch.
  - name: qa-small-e1-s0
    method: qa
    split: val
    threshold: 0.5
    params: {model_dir: models/qa-small-e1-s0}
    train: "--model microsoft/deberta-v3-small --epochs 1 --lr 3e-5 --batch 8 --accum 4 --seed 0"

  # Local LLM via Ollama. Prompts live in clausescout/llm/prompts/<version>.md, one file per
  # version, and every version is tuned on validation only.
  - name: llm-qwen7b-v1
    method: llm
    split: val
    threshold: 0.5
    params: {backend: ollama, model: "qwen2.5:7b", num_ctx: 8192, prompt_version: v1,
             chunk_chars: 12000, overlap_chars: 1500}
